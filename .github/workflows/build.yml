name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/petalplanner
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PetalPlanner"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.petalplanner'
              compileSdk 34

              defaultConfig {
                  applicationId "com.petalplanner"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          touch app/proguard-rules.pro

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PetalPlanner">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".AddTaskActivity" android:exported="false"/>
                  <receiver android:name=".ReminderReceiver" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/Task.kt
          package com.petalplanner
          data class Task(val id: Long, val title: String, val time: Long, val done: Boolean = false)
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/TaskRepository.kt
          package com.petalplanner
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          object TaskRepository {
              private const val PREFS = "petal_prefs"
              private const val KEY = "tasks"
              fun load(context: Context): MutableList<Task> {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val json = prefs.getString(KEY, "[]") ?: "[]"
                  val arr = JSONArray(json)
                  val list = mutableListOf<Task>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      list.add(Task(o.getLong("id"), o.getString("title"), o.getLong("time"), o.optBoolean("done", false)))
                  }
                  return list
              }
              fun save(context: Context, tasks: List<Task>) {
                  val arr = JSONArray()
                  tasks.forEach {
                      val o = JSONObject()
                      o.put("id", it.id); o.put("title", it.title); o.put("time", it.time); o.put("done", it.done)
                      arr.put(o)
                  }
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY, arr.toString()).apply()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/ReminderScheduler.kt
          package com.petalplanner
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          object ReminderScheduler {
              fun schedule(context: Context, task: Task) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = pendingIntent(context, task)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !am.canScheduleExactAlarms()) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, task.time, pi)
                  } else {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, task.time, pi)
                  }
              }
              fun cancel(context: Context, task: Task) {
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.cancel(pendingIntent(context, task))
              }
              private fun pendingIntent(context: Context, task: Task): PendingIntent {
                  val intent = Intent(context, ReminderReceiver::class.java).apply {
                      putExtra("id", task.id); putExtra("title", task.title)
                  }
                  return PendingIntent.getBroadcast(context, task.id.toInt(), intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/ReminderReceiver.kt
          package com.petalplanner
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val id = intent.getLongExtra("id", 0L)
                  val title = intent.getStringExtra("title") ?: "Напоминание"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel("petal_channel", "Напоминания", NotificationManager.IMPORTANCE_HIGH)
                      nm.createNotificationChannel(ch)
                  }
                  val open = PendingIntent.getActivity(context, 0, Intent(context, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val notif = NotificationCompat.Builder(context, "petal_channel")
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle("Petal Planner 🌸")
                      .setContentText(title)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  if (Build.VERSION.SDK_INT < 33 || context.checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) {
                      nm.notify(id.toInt(), notif)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/BootReceiver.kt
          package com.petalplanner
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val now = System.currentTimeMillis()
                      TaskRepository.load(context).filter { !it.done && it.time > now }.forEach { ReminderScheduler.schedule(context, it) }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/MainActivity.kt
          package com.petalplanner
          import android.Manifest
          import android.app.AlarmManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.petalplanner.databinding.ActivityMainBinding
          import com.petalplanner.databinding.ItemTaskBinding
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              private val tasks = mutableListOf<Task>()
              private lateinit var adapter: TaskAdapter
              private val notifPermLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  adapter = TaskAdapter(tasks) { task ->
                      ReminderScheduler.cancel(this, task)
                      tasks.remove(task)
                      persist()
                  }
                  binding.recycler.layoutManager = LinearLayoutManager(this)
                  binding.recycler.adapter = adapter
                  binding.fab.setOnClickListener { startActivity(Intent(this, AddTaskActivity::class.java)) }
                  requestNotifPermission()
                  requestExactAlarmPermission()
              }

              override fun onResume() {
                  super.onResume()
                  tasks.clear()
                  tasks.addAll(TaskRepository.load(this).sortedBy { it.time })
                  refreshEmpty()
                  adapter.notifyDataSetChanged()
              }

              private fun persist() {
                  TaskRepository.save(this, tasks)
                  refreshEmpty()
                  adapter.notifyDataSetChanged()
              }

              private fun refreshEmpty() {
                  binding.empty.visibility = if (tasks.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun requestNotifPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      notifPermLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
              }

              private fun requestExactAlarmPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      if (!am.canScheduleExactAlarms()) {
                          AlertDialog.Builder(this)
                              .setTitle("Точные напоминания")
                              .setMessage("Разрешить точные напоминания?")
                              .setPositiveButton("Открыть") { _, _ -> startActivity(Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM)) }
                              .setNegativeButton("Позже", null)
                              .show()
                      }
                  }
              }
          }

          class TaskAdapter(private val items: List<Task>, private val onDelete: (Task) -> Unit) : RecyclerView.Adapter<TaskAdapter.VH>() {
              private val fmt = SimpleDateFormat("dd MMM yyyy, HH:mm", Locale.getDefault())
              class VH(val b: ItemTaskBinding) : RecyclerView.ViewHolder(b.root)
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val b = ItemTaskBinding.inflate(LayoutInflater.from(parent.context), parent, false)
                  return VH(b)
              }
              override fun onBindViewHolder(holder: VH, position: Int) {
                  val t = items[position]
                  holder.b.title.text = t.title
                  holder.b.time.text = fmt.format(Date(t.time))
                  holder.b.delete.setOnClickListener { onDelete(t) }
              }
              override fun getItemCount() = items.size
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/petalplanner/AddTaskActivity.kt
          package com.petalplanner
          import android.app.DatePickerDialog
          import android.app.TimePickerDialog
          import android.os.Bundle
          import android.text.format.DateFormat
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.petalplanner.databinding.ActivityAddTaskBinding
          import java.util.Calendar

          class AddTaskActivity : AppCompatActivity() {
              private lateinit var binding: ActivityAddTaskBinding
              private val cal: Calendar = Calendar.getInstance().apply {
                  add(Calendar.MINUTE, 5); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityAddTaskBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  binding.pickDate.setOnClickListener {
                      DatePickerDialog(this, { _, y, m, d ->
                          cal.set(Calendar.YEAR, y); cal.set(Calendar.MONTH, m); cal.set(Calendar.DAY_OF_MONTH, d); updateLabel()
                      }, cal.get(Calendar.YEAR), cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH)).show()
                  }
                  binding.pickTime.setOnClickListener {
                      TimePickerDialog(this, { _, h, min ->
                          cal.set(Calendar.HOUR_OF_DAY, h); cal.set(Calendar.MINUTE, min); updateLabel()
                      }, cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE), true).show()
                  }
                  updateLabel()
                  binding.save.setOnClickListener {
                      val title = binding.title.text.toString().trim()
                      if (title.isEmpty()) { Toast.makeText(this, "Введите название", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      if (cal.timeInMillis <= System.currentTimeMillis()) { Toast.makeText(this, "Выберите время в будущем", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      val task = Task(System.currentTimeMillis(), title, cal.timeInMillis)
                      val list = TaskRepository.load(this).toMutableList()
                      list.add(task)
                      TaskRepository.save(this, list)
                      ReminderScheduler.schedule(this, task)
                      finish()
                  }
              }
              private fun updateLabel() {
                  val df = DateFormat.getMediumDateFormat(this)
                  val tf = DateFormat.getTimeFormat(this)
                  binding.dateLabel.text = "${df.format(cal.time)}  ${tf.format(cal.time)}"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
